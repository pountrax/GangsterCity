                    <!-- ===== CLAN ===== -->
                    <section id="tab-clan" class="tab">
                        <h2>Clan</h2>

                        <!-- MI CLAN (solo se ve si pertenecés a uno) -->
                        <div id="myClanBox" hidden>
                            <div class="clan-card">
                                <div class="clan-emblem">🏴</div>
                                <div>
                                    <strong id="clanName">---</strong>
                                    <p class="muted" id="clanInfo"></p>
                                </div>
                            </div>

                            <!-- Subpestañas del clan: Miembros / Chat -->
                            <div class="sub-tabs">
                                <button class="sub-tab active" data-clanpane="miembros" type="button">👥 Miembros</button>
                                <button class="sub-tab" data-clanpane="chat" type="button">💬 Chat del clan</button>
                            </div>

                            <!-- Subpestaña 1: lista de miembros -->
                            <div id="clanPane-miembros" class="clan-pane active">
                                <div class="stats-box">
                                    <div class="stats-head">
                                        <h3>Miembros</h3>
                                        <div class="points-badge">Tu rango: <strong id="myRoleValue">---</strong></div>
                                    </div>
                                    <!-- Las filas las crea script.js -->
                                    <div id="clanMembers"></div>
                                </div>
                                <div class="clan-actions">
                                    <button id="leaveClanBtn" class="action-btn danger" type="button">Salir del clan</button>
                                </div>
                            </div>

                            <!-- Subpestaña 2: chat del clan -->
                            <div id="clanPane-chat" class="clan-pane">
                                <div id="clanChatLog"></div>
                                <form id="clanChatForm" class="inline-form">
                                    <input id="clanChatInput" type="text" maxlength="200" placeholder="Escribile a tu clan..." autocomplete="off">
                                    <button type="submit" class="action-btn">Enviar</button>
                                </form>
                            </div>
                        </div>

                        <!-- CREAR CLAN (solo se ve si NO tenés clan) -->
                        <div id="createClanBox">
                            <h3>Crear clan</h3>
                            <p class="muted" id="createClanReq">Requiere nivel 10.</p>
                            <form id="createClanForm" class="inline-form">
                                <input id="clanNameInput" type="text" maxlength="20" placeholder="Nombre del clan" autocomplete="off">
                                <button type="submit" id="createClanBtn" class="action-btn" disabled>Crear</button>
                            </form>
                        </div>

                        <!-- CLANES DISPONIBLES (solo se ve si NO tenés clan) -->
                        <div id="joinClanBox">
                            <h3>Clanes disponibles</h3>
                            <p class="muted" id="joinClanReq">Requiere nivel 5 para unirse.</p>
                            <table class="simple-table">
                                <thead><tr><th>Clan</th><th>Miembros</th><th></th></tr></thead>
                                <tbody id="clanJoinList"></tbody>
                            </table>
                        </div>

                        <p id="clanMsg" class="muted"></p>
                    </section>
