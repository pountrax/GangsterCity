<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Game</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
</head>
<body>
    <!-- Ranking global: siempre visible -->
    <h2>🏆 Ranking global</h2>
    <div id="scoreWrap">
        <table id="scoreboard">
            <thead>
                <tr><th>#</th><th>Usuario</th><th>Puntos</th></tr>
            </thead>
            <tbody></tbody>
        </table>
    </div>

    <!-- Pantalla de ingreso -->
    <div id="login">
        <form id="loginForm">
            <h2>Entrar al juego</h2>
            <p class="hint">Si el usuario no existe, se crea automáticamente.</p>
            <input id="username" type="text" placeholder="Usuario" maxlength="20" autocomplete="username" required>
            <input id="password" type="password" placeholder="Contraseña" autocomplete="current-password" required>
            <button type="submit" id="loginBtn">Entrar</button>
            <p id="loginError"></p>
        </form>
    </div>

    <!-- Juego -->
    <div id="game" hidden>
        <!-- Panel con dinero y energía -->
<div id="hud">
    <div class="stat">
        <div class="stat-label">💵 Dinero: <span id="moneyValue">0</span></div>
    </div>
    <div class="stat">
        <div class="stat-label">
            ⚡ Energía: <span id="energyValue">0</span>/<span id="energyMax">100</span>
            <small id="energyTimer"></small>
        </div>
        <!-- Barra: su ancho se cambia desde script.js -->
        <div class="bar"><div id="energyBar" class="bar-fill"></div></div>
    </div>
</div>

<!-- Panel de misiones -->
<div id="missions">
    <h2>Misiones</h2>
    <!-- Se muestra solo mientras hay una misión en curso -->
    <div id="missionActive" hidden>
        <p id="missionActiveText"></p>
        <div class="bar"><div id="missionBar" class="bar-fill mission-fill"></div></div>
    </div>
    <!-- Los botones de misiones los crea script.js con la lista del servidor -->
    <div id="missionList"></div>
    <p id="missionMsg"></p>
</div>
        <canvas id="gameCanvas"></canvas>

        <div id="chat">
            <h2>Chat global</h2>
            <div id="chatLog"></div>
            <form id="chatForm">
                <input id="chatInput" type="text" placeholder="Escribí un mensaje..." maxlength="200" autocomplete="off">
                <button type="submit">Enviar</button>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
